name: Static Testing

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  phpstan:
    name: PHPStan (Static Analysis)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP dan Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install dependency
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Jalankan PHPStan
        run: vendor/bin/phpstan analyse --configuration=phpstan.neon --memory-limit=512M --no-progress --error-format=table

  phpcs:
    name: PHP_CodeSniffer (PSR-12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup PHP dan Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install dependency
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Jalankan PHP_CodeSniffer
        run: vendor/bin/phpcs --standard=phpcs.xml --runtime-set ignore_warnings_on_exit 1
